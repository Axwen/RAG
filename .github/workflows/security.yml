# 安全检查：密钥扫描、依赖漏洞、PR 依赖变更审查。
#
# 三条各管一件事，不要互相替代：
#   gitleaks          历史与工作区里有没有真凭证。仓库的 .env/.env.* 已被 gitignore，
#                     但"被忽略"和"从没被提交过"是两件事——只有扫全历史才能确认。
#                     用 scripts/check-secrets.sh 直接调二进制，不用 gitleaks-action：
#                     后者按事件名收窄扫描范围（push 上只扫本次推送的提交），并且在 PR 上
#                     因缺 pull-requests 权限必红。
#   pnpm audit        已装依赖有没有已知漏洞。critical 阻断，high 只报告：没有修复版本
#                     的传递依赖告警会把所有 PR 堵死，那样的门禁最后一定被绕过。
#   dependency-review PR 里新引入的依赖及其许可证。供应链的入口在这一刻，不在事后。
#
# 本工作流同样不读取 repository secret，也不做付费云调用。
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 05:23 UTC：漏洞库是变的，代码不动也要重扫
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  # 带上事件名：不然周一的定时扫和同时段推到 main 会落进同一组，后者把前者取消掉——
  # 而定时扫的全部意义就是"代码不动也要重扫"。
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks（全历史密钥扫描）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 全历史：只扫当前树等于假设"以前没提交过凭证"
          fetch-depth: 0

      - name: gitleaks（所有引用可达的提交）
        # 不用 gitleaks/gitleaks-action：它按事件名自己决定扫描范围。实测它在 push 上
        # 拼出 `--log-opts=--no-merges --first-parent <before>^..<sha>`，日志写着
        # 「2 commits scanned.」——一个叫「全历史密钥扫描」的门禁，实际只扫
        # 这次推送的两条提交；而在 pull_request 上它改走 ScanPullRequest，要读 PR 的提交
        # 列表，默认只读 token 没有 pull-requests 权限，直接
        # 「Resource not accessible by integration」，于是每个 PR 上都挂一个永远红的门禁。
        # 根因在 gitleaks 源码里：不传 --log-opts 时它跑
        # `git log -p -U0 --full-history --all --diff-filter=tuxdb`；一旦传了 --log-opts，
        # 这三个默认遍历参数会被整个丢掉，只剩用户给的范围。直接调二进制就没有这层隐式
        # 行为，三种事件下跑同一条命令；版本与 sha256 钉在脚本里（见 ci-cd.md §2.3）。
        run: bash scripts/check-secrets.sh --strict

  deps-audit:
    name: pnpm audit（critical 阻断 / high 报告）
    runs-on: ubuntu-24.04
    # 20 而不是与其他 job 一致的 15：critical 那步最坏情况是三轮都网络不可达，而 pnpm 自己
    # 每轮还要退避约 4 分钟（10s / 60s 两次），加上外层的 20s / 40s 退避约 13 分钟。留到 20
    # 是为了让那一步自己给出「audit 端点三轮均不可达」的诊断，而不是被 job 超时截成一条
    # 看不出原因的红。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 冻结安装（不跑生命周期脚本）
        # --ignore-scripts 是必须的：根 postinstall 会跑 prisma generate，而 Prisma 的
        # config 解析要求 DATABASE_URL 存在（首跑就是这样红的：PrismaConfigEnvError:
        # Cannot resolve environment variable: DATABASE_URL）。ci.yml 的 job 靠前置
        # `cp .env.example .env` 绕开，但这个 job 只需要依赖图——pnpm audit 读的是
        # lockfile，不需要生成出来的 Prisma Client。少造一份占位 .env，也少一次生成。
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: critical 漏洞（阻断）
        # 显式指定官方 registry：本地开发常配 npmmirror，其 audit 端点不存在。
        #
        # 带重试，因为这一条是 required check 而它依赖活网络：audit 端点在 pnpm 自己那三次
        # 退避（10s / 60s）之后仍然可能 ERR_SOCKET_TIMEOUT（2026-09-04 在 PR #28 上实测，
        # 整步耗时 4 分钟后失败），一次 npm 侧抖动就把合并挡住，而它跟依赖安全毫无关系。
        #
        # 重试只针对「取不到数据」：真有 critical 通告时输出里没有网络错误码，立刻按原样失败，
        # 不给自己留一条「多试几次就过了」的后门。三轮都不可达也仍然失败——审计跑不了不等于
        # 没有漏洞，fail closed 与仓库其他门禁一致。
        run: |
          for attempt in 1 2 3; do
            if out=$(pnpm audit --audit-level critical --registry https://registry.npmjs.org 2>&1); then
              printf '%s\n' "${out}"
              exit 0
            fi
            printf '%s\n' "${out}"
            if ! printf '%s' "${out}" | grep -qE 'ERR_SOCKET_TIMEOUT|ERR_PNPM_FETCH|FetchError|ETIMEDOUT|ECONNRESET|EAI_AGAIN|socket hang up'; then
              echo "::error::pnpm audit 报告了 critical 通告（不是网络错误），不重试"
              exit 1
            fi
            echo "::warning::第 ${attempt} 次 audit 因网络错误失败"
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "::error::audit 端点三轮均不可达：这不是「没有漏洞」，是取不到数据"
          exit 1

      - name: high 及以下（只报告，不阻断）
        continue-on-error: true
        run: pnpm audit --audit-level high --registry https://registry.npmjs.org

  dependency-review:
    name: dependency-review（PR 新增依赖与许可证）
    # 两个条件都是必要的：
    #   1. 这个 action 只在 PR 上有意义——它比较 base 与 head 的依赖差异；
    #   2. private repo 上它要求 Code Security / Advanced Security，否则直接报
    #      "Dependency review is not supported on this repository"。首批 Dependabot PR
    #      上三条全是这样红的，而 PR 恰恰是人真会去看红叉的地方——一个永远红的检查放在
    #      那里，代价比 push 上的更大。变量与 codeql.yml 共用（见 ci-cd.md §3.3）。
    if: github.event_name == 'pull_request' && vars.ADVANCED_SECURITY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # 把差异摘要贴到 PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # 阶段 1 只用宽松许可证；copyleft 依赖进来前必须先有决策记录
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
