# 阶段 1 CI 冻结检查（T0）。
#
# 原则：
# - 只执行本地 `pnpm verify` / `pnpm py:test` 已覆盖的同一批检查，命令保持一致，
#   避免 CI 与本地出现"只在一边通过"的偏差。
# - 不读取仓库外凭证：环境变量一律来自 `.env.example` 的占位值（其中模型 key 是
#   刻意无效的 `sk-INVALID-...`），不使用任何 repository secret。
# - 不触发付费云模型调用：本工作流不运行 evals，也不启动 parser/evaluation profile。
# - 依赖安装全部冻结：pnpm `--frozen-lockfile`，uv `--frozen`。
#
# 工作流分工（详见 docs/engineering/ci-cd.md）：
#   ci.yml           本文件——静态检查、单测、覆盖率、构建，纯 CPU，无中间件
#   integration.yml  真起六个容器 + bootstrap + 进程级冒烟与日志断言
#   security.yml     密钥扫描、依赖漏洞、依赖变更审查
#   codeql.yml       静态安全分析（TS + Python）
#   release.yml      打标签后的镜像与 Release 产物
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 关闭第三方遥测，CI 不产生对外上报
  NEXT_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  node:
    name: node（lint / typecheck / test / prisma / build）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        # 版本来自 package.json 的 packageManager 字段，不在此处重复声明

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 准备占位环境变量
        # prisma validate 与 compose config 需要变量存在；.env.example 内全是无效占位值
        run: cp .env.example .env

      - name: 冻结安装
        run: pnpm install --frozen-lockfile

      - name: 格式检查
        run: pnpm run format

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: 单元测试
        run: pnpm run test

      - name: Prisma schema 校验
        run: pnpm run db:validate

      - name: 构建
        run: pnpm run build

      - name: 确认工作区未被构建产物污染
        # 构建不应改写任何被跟踪文件（例如 Next.js 回写 tsconfig.json）
        run: git diff --exit-code

  quality:
    name: quality（shell / YAML / 链接 / 提交信息 / 覆盖率）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 提交信息检查要比较 origin/main..HEAD，需要完整历史
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 准备占位环境变量
        run: cp .env.example .env

      - name: 冻结安装
        run: pnpm install --frozen-lockfile

      - name: Shell 静态检查（shellcheck，阈值 warning）
        # --strict：CI 里 shellcheck 必须存在，不允许像本地那样降级跳过
        run: bash scripts/check-shell.sh --strict

      - name: Markdown 相对链接与锚点
        run: pnpm run check:links

      # 名字里不能出现裸的 "run: "——冒号加空格会让 YAML 把它当成映射键，整个文件解析失败
      # （本地结构校验就是这样抓到的：mapping values are not allowed here, line 112）
      - name: '工作流 YAML 静态检查（actionlint + run: 块的 shellcheck）'
        # 740 行工作流此前是仓库里唯一没有静态检查的代码，而 run: 块里的 shell 也从不
        # 经过 check-shell.sh。--strict 会下载钉死版本并校验 sha256（见脚本内注释）。
        run: bash scripts/check-workflows.sh --strict

      - name: 提交信息规范（Conventional Commits）
        # 必须显式传区间：push 到 main 时 checkout 把本地 main 指到 origin/main，
        # 脚本默认的 origin/main..HEAD 恒为空——前 10 次运行就是这样"通过"的，
        # 日志原文「范围 origin/main..HEAD 内无非 merge 提交」，零条提交被检查。
        # github.event.before 是本次推送前的 main 顶点，区间正好是这次推的那几条。
        # PR 上留空走脚本默认（那时 origin/main..HEAD 就是 PR 的提交集）。
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == 'push' && "${BEFORE}" != '0000000000000000000000000000000000000000' ]]; then
            bash scripts/check-commits.sh "${BEFORE}..${SHA}"
          else
            bash scripts/check-commits.sh
          fi

      - name: 构建工作区包（覆盖率前置）
        # 跨包 import 解析到 package.json 的 main（dist/index.js），不是源码——不先构建，
        # 6 个测试文件会直接加载失败，报的却是"exports 写错了"。首跑第二轮就是这样红的：
        # node job 恰好因为 typecheck 也是 `tsc -b`（会 emit）才没暴露这条依赖。
        # 只构建 packages/*（约 2s）：apps/* 的测试 import 的是各自 src，不需要其 dist，
        # 也不必在这个 job 里跑 next build。vitest.config.ts 里有同源的前置校验。
        run: pnpm --filter "./packages/*" run build

      - name: 覆盖率（阈值见 vitest.config.ts）
        run: pnpm run test:coverage

      - name: 增量覆盖率（本次改动的新增行 ≥ 80%）
        # 全局阈值拦的是整体退化，拦不住"这次新增的没测"：仓库越大，一个全新的未测文件
        # 对整体的拉低越小。这条只看本次改动涉及的、被插桩的行。
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == 'push' && "${BEFORE}" != '0000000000000000000000000000000000000000' ]]; then
            bash scripts/check-diff-coverage.sh "${BEFORE}..${SHA}"
          else
            bash scripts/check-diff-coverage.sh
          fi

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  python:
    name: python（parser uv / pytest）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 钉精确版本：astral-sh/setup-uv 自 v8 起不再发布浮动大版本标签，@v10 是 404
      # （tags 里只有 v10.0.1 / v10.0.0；v7 及更早才有 v7、v7.6 这种浮动 ref）。
      # 首跑就是这样红的——"Unable to resolve action ... unable to find version v10"，
      # 连 Set up job 都没过。补丁位由 Dependabot 的 github-actions 生态跟。
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.5'
          # 与 pyproject 的 requires-python = "==3.12.*" 同口径，不钉补丁位：
          # 精确补丁位是 Dockerfile 的事（那里要可复现的镜像），CI 只需要 3.12.x，
          # 钉死反而会在某个 python-build-standalone 构建下线时凭空红一次。
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: services/parser/uv.lock

      - name: 校验锁文件与 pyproject 一致
        run: uv lock --check

      - name: 冻结安装
        run: uv sync --frozen

      - name: pytest
        run: uv run pytest -q

  compose:
    name: compose（配置解析 / parser 镜像构建与启动）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 准备占位环境变量
        run: cp .env.example .env

      - name: Compose 配置解析（含 parser 与 evaluation profile）
        run: >-
          docker compose --env-file .env -f infra/compose/compose.yml
          --profile parser --profile evaluation config -q

      - name: 初始化脚本语法检查
        run: bash -n infra/compose/init/*.sh

      - name: Keycloak Realm JSON 可解析
        run: python3 -c "import json,sys; json.load(open('infra/compose/keycloak/realm-rag-local.json'))"

      - name: 构建 Parser 镜像
        # 不推送任何镜像；构建产物交给下一步真起一次
        run: docker build -t rag-parser:ci services/parser

      - name: Parser 镜像启动验证
        # 构建成功只证明依赖装得上。缺模块入口、非 root 用户读不到 /opt/venv、
        # 端口没人监听——这些都能构建通过然后在第一次 docker run 时失败。
        run: bash scripts/check-parser-image.sh rag-parser:ci
