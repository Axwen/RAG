# 阶段 1 CI 冻结检查（T0）。
#
# 原则：
# - 只执行本地 `pnpm verify` / `pnpm py:test` 已覆盖的同一批检查，命令保持一致，
#   避免 CI 与本地出现"只在一边通过"的偏差。
# - 不读取仓库外凭证：环境变量一律来自 `.env.example` 的占位值（其中模型 key 是
#   刻意无效的 `sk-INVALID-...`），不使用任何 repository secret。
# - 不触发付费云模型调用：本工作流不运行 evals，也不启动 parser/evaluation profile。
# - 依赖安装全部冻结：pnpm `--frozen-lockfile`，uv `--frozen`。
#
# 工作流分工（详见 docs/engineering/ci-cd.md）：
#   ci.yml           本文件——静态检查、单测、覆盖率、构建，纯 CPU，无中间件
#   integration.yml  真起六个容器 + bootstrap + 进程级冒烟与日志断言
#   security.yml     密钥扫描、依赖漏洞、依赖变更审查
#   codeql.yml       静态安全分析（TS + Python）
#   release.yml      打标签后的镜像与 Release 产物
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 关闭第三方遥测，CI 不产生对外上报
  NEXT_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  node:
    name: node（lint / typecheck / test / prisma / build）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # 版本来自 package.json 的 packageManager 字段，不在此处重复声明

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 准备占位环境变量
        # prisma validate 与 compose config 需要变量存在；.env.example 内全是无效占位值
        run: cp .env.example .env

      - name: 冻结安装
        run: pnpm install --frozen-lockfile

      - name: 格式检查
        run: pnpm run format

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: 单元测试
        run: pnpm run test

      - name: Prisma schema 校验
        run: pnpm run db:validate

      - name: 构建
        run: pnpm run build

      - name: 确认工作区未被构建产物污染
        # 构建不应改写任何被跟踪文件（例如 Next.js 回写 tsconfig.json）
        run: git diff --exit-code

  quality:
    name: quality（shell / 链接 / 提交信息 / 覆盖率）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # 提交信息检查要比较 origin/main..HEAD，需要完整历史
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 准备占位环境变量
        run: cp .env.example .env

      - name: 冻结安装
        run: pnpm install --frozen-lockfile

      - name: Shell 静态检查（shellcheck，阈值 warning）
        # --strict：CI 里 shellcheck 必须存在，不允许像本地那样降级跳过
        run: bash scripts/check-shell.sh --strict

      - name: Markdown 相对链接与锚点
        run: pnpm run check:links

      - name: 提交信息规范（Conventional Commits）
        run: pnpm run check:commits

      - name: 构建工作区包（覆盖率前置）
        # 跨包 import 解析到 package.json 的 main（dist/index.js），不是源码——不先构建，
        # 6 个测试文件会直接加载失败，报的却是"exports 写错了"。首跑第二轮就是这样红的：
        # node job 恰好因为 typecheck 也是 `tsc -b`（会 emit）才没暴露这条依赖。
        # 只构建 packages/*（约 2s）：apps/* 的测试 import 的是各自 src，不需要其 dist，
        # 也不必在这个 job 里跑 next build。vitest.config.ts 里有同源的前置校验。
        run: pnpm --filter "./packages/*" run build

      - name: 覆盖率（阈值见 vitest.config.ts）
        run: pnpm run test:coverage

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

  python:
    name: python（parser uv / pytest）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/parser
    steps:
      - uses: actions/checkout@v7

      # 钉精确版本：astral-sh/setup-uv 自 v8 起不再发布浮动大版本标签，@v10 是 404
      # （tags 里只有 v10.0.1 / v10.0.0；v7 及更早才有 v7、v7.6 这种浮动 ref）。
      # 首跑就是这样红的——"Unable to resolve action ... unable to find version v10"，
      # 连 Set up job 都没过。补丁位由 Dependabot 的 github-actions 生态跟。
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.12.5'
          # 与 pyproject 的 requires-python = "==3.12.*" 同口径，不钉补丁位：
          # 精确补丁位是 Dockerfile 的事（那里要可复现的镜像），CI 只需要 3.12.x，
          # 钉死反而会在某个 python-build-standalone 构建下线时凭空红一次。
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: services/parser/uv.lock

      - name: 校验锁文件与 pyproject 一致
        run: uv lock --check

      - name: 冻结安装
        run: uv sync --frozen

      - name: pytest
        run: uv run pytest -q

  compose:
    name: compose（配置解析 / parser 镜像构建）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: 准备占位环境变量
        run: cp .env.example .env

      - name: Compose 配置解析（含 parser 与 evaluation profile）
        run: >-
          docker compose --env-file .env -f infra/compose/compose.yml
          --profile parser --profile evaluation config -q

      - name: 初始化脚本语法检查
        run: bash -n infra/compose/init/*.sh

      - name: Keycloak Realm JSON 可解析
        run: python3 -c "import json,sys; json.load(open('infra/compose/keycloak/realm-rag-local.json'))"

      - name: 构建 Parser 镜像
        # 只验证 Dockerfile 可构建，不推送任何镜像
        run: docker build -t rag-parser:ci services/parser
