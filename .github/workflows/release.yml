# 打标签后的发布产物。
#
# 阶段 1 的诚实边界，先说清楚"这条流水线不做什么"：
#   - 只发布 Parser 镜像。api / web / worker 没有 Dockerfile（仓库里只有
#     services/parser/Dockerfile 与探针用的 deepdoc 镜像），因此无从构建，
#     不做"看起来在发布"的空步骤。
#   - 不部署。生产 Kubernetes 明确不在阶段 1 范围（PROJECT_STATE.md「核心架构不变量」），
#     真实部署目标、Secret 管理与回滚演练都还没有决策记录，此处不预先编造。
#   - CD 的 D 目前只到"产物可被拉取"：镜像进 GHCR、Release 附 SBOM。
#     部署编排等 T15/T16 阶段有目标环境后再加，届时补 ADR。
#
# 触发：推 v* 标签。标签必须与 CHANGELOG.md 的段落对齐，否则 release-notes 步骤失败——
# 宁可发布失败，也不要发出一个没人写过变更说明的版本。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（须已存在）'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # 发布不允许被后一次推送打断

permissions:
  contents: read

jobs:
  guard:
    name: guard（发布前重跑全量检查）
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 准备占位环境变量
        run: cp .env.example .env

      - name: 冻结安装
        run: pnpm install --frozen-lockfile

      - name: 全量 verify（与本地同一条命令）
        # 标签可能指向未过 CI 的提交，发布前必须自证
        run: pnpm run verify

      - name: Release notes 与标签对齐
        run: bash scripts/release-notes.sh "${{ inputs.tag || github.ref_name }}"

  parser-image:
    name: parser 镜像（GHCR）
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # 推 GHCR
      id-token: write # 构建来源证明（provenance）
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/parser
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/parser
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true # 记录"这个镜像由哪次工作流、哪个提交构建"
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 生成 SBOM（SPDX）
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/parser@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: parser-sbom.spdx.json
          output-file: parser-sbom.spdx.json

      - name: 上传 SBOM
        uses: actions/upload-artifact@v4
        with:
          name: parser-sbom
          path: parser-sbom.spdx.json
          retention-days: 90

  github-release:
    name: GitHub Release
    needs: [guard, parser-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # 建 Release
    steps:
      - uses: actions/checkout@v7

      - name: 取 SBOM
        uses: actions/download-artifact@v4
        with:
          name: parser-sbom

      - name: 生成 Release notes
        run: bash scripts/release-notes.sh "${{ inputs.tag || github.ref_name }}" > RELEASE_NOTES.md

      - name: 建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: parser-sbom.spdx.json
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
