# 依赖更新。
#
# 分组是刻意的：不分组的话，一个 monorepo 每周能开出十几个 PR，最后没人看——
# 而"没人看的自动 PR"比不开 PR 更糟，它让仓库看起来在维护。
# 按生态各开一个 PR，安全更新单独走，方便优先处理。
#
# 更新只是提议：每个 PR 都要过 CI + Integration，锁文件冻结安装的纪律不因自动化放宽。
version: 2

updates:
  # npm 这一段从 2026-09-02 02:04 建立起到当天 12:xx 一个 PR 都没产出过，而且是"成功地"
  # 什么都没产出：Dependabot Updates 那条 run 是 failure，但它只出现在 Insights →
  # Dependabot 页，不在平时看的 Actions 列表里。日志里每个依赖一条：
  #   Handled error whilst updating zod: tool_version_not_supported
  #     {"tool-name": "Node", "detected-version": "22.23.1", "supported-versions": "v24.20.0"}
  #   Skipping zod in group others: No dependency change was created
  # 根因是 package.json 的 `engines.node` 写成精确值 "22.23.1"，而 Dependabot 的 npm
  # updater 镜像只带 v24.20.0——它照 engines 选 Node，选不到就整个 job 放弃。zod、tsx、
  # typescript、vite、@types/node 五个候选全被跳过。
  # 已把 engines.node 改成 ">=22.23.1"（.nvmrc 与 CI 的 setup-node 仍钉 22.23.1，那才是
  # 开发/构建用的版本）。**不要把它改回精确值**：engines 是"能跑在哪些 Node 上"的声明，
  # 精确值等于对所有用别的 Node 的工具关门，Dependabot 只是第一个撞上的。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      # 类型定义与 lint 工具一起升，它们几乎总是一起变
      dev-tooling:
        patterns: ['@types/*', 'eslint*', 'typescript-eslint', 'prettier', 'vitest', '@vitest/*']
        update-types: [minor, patch]
      nestjs:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      others:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, javascript]

  # uv 生态（services/parser 的 uv.lock）。若 Dependabot 报"unknown ecosystem"，
  # 说明该账号尚未开放 uv 支持，改成 package-ecosystem: pip 即可（见 docs/engineering/ci-cd.md）
  - package-ecosystem: uv
    directory: /services/parser
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, python]
    ignore:
      # PROBE-002 结论：updown_concat_xgb.model 是二进制模型文件，xgboost 3.1 起
      # 拒绝加载，必须锁 <3.1。升级要先重训或转格式，不能由自动 PR 决定
      - dependency-name: xgboost
        versions: ['>=3.1']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
        # 只把 minor/patch 合到一个 PR 里；major 刻意留在组外，各自单独开 PR。
        # 不加这一行的代价实测过：PR #5 一次带了 8 个 major（upload-artifact v4→v7、
        # download-artifact v4→v8、docker/* 三个各跳一个大版本、action-gh-release v2→v3
        # 等），八个破坏性变更挤在一个 commit 里，红了也没法二分。npm 那边的 `others`
        # 组从一开始就写了 `update-types: [minor, patch]`，这里漏了——同一份配置里的
        # 两套标准。
        update-types: [minor, patch]
    # major 拆成单个 PR 之后条数会变多（当下就积了 8 个），limit 从 3 提到 5，与 npm 一致。
    # 这与顶部"分组是刻意的"不矛盾：分组要避免的是**没人看**的 PR，而 major 恰恰是必须
    # 一个一个看的那种。
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies, github-actions]

  - package-ecosystem: docker
    directory: /services/parser
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, docker]
    ignore:
      # Python 小版本不能由自动 PR 决定：pyproject.toml 与 uv.lock 都写死
      # requires-python = "==3.12.*"，基础镜像跳到 3.13/3.14 会让容器内的
      # `uv sync --frozen` 直接拒绝解析（首个此类 PR 就是 3.12.3 → 3.14.7）。
      # 更要紧的是 T4 要接入的 DeepDOC 依赖链（infinity-sdk 0.7.3、xgboost<3.1、
      # onnxruntime）在 PROBE-002 里是按 3.12 实测的，换小版本等于让探针结论失效。
      # 升级路径是人工的：先改 requires-python + 重跑 uv lock + 复测 PROBE-002。
      # 补丁位（3.12.x）仍然自动跟——那是安全修复，正是要它跟的。
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
