# 依赖更新。
#
# 分组是刻意的：不分组的话，一个 monorepo 每周能开出十几个 PR，最后没人看——
# 而"没人看的自动 PR"比不开 PR 更糟，它让仓库看起来在维护。
# 按生态各开一个 PR，安全更新单独走，方便优先处理。
#
# 更新只是提议：每个 PR 都要过 CI + Integration，锁文件冻结安装的纪律不因自动化放宽。
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      # 类型定义与 lint 工具一起升，它们几乎总是一起变
      dev-tooling:
        patterns: ['@types/*', 'eslint*', 'typescript-eslint', 'prettier', 'vitest', '@vitest/*']
        update-types: [minor, patch]
      nestjs:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      others:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, javascript]

  # uv 生态（services/parser 的 uv.lock）。若 Dependabot 报"unknown ecosystem"，
  # 说明该账号尚未开放 uv 支持，改成 package-ecosystem: pip 即可（见 docs/engineering/ci-cd.md）
  - package-ecosystem: uv
    directory: /services/parser
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, python]
    ignore:
      # PROBE-002 结论：updown_concat_xgb.model 是二进制模型文件，xgboost 3.1 起
      # 拒绝加载，必须锁 <3.1。升级要先重训或转格式，不能由自动 PR 决定
      - dependency-name: xgboost
        versions: ['>=3.1']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies, github-actions]

  - package-ecosystem: docker
    directory: /services/parser
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, docker]
    ignore:
      # Python 小版本不能由自动 PR 决定：pyproject.toml 与 uv.lock 都写死
      # requires-python = "==3.12.*"，基础镜像跳到 3.13/3.14 会让容器内的
      # `uv sync --frozen` 直接拒绝解析（首个此类 PR 就是 3.12.3 → 3.14.7）。
      # 更要紧的是 T4 要接入的 DeepDOC 依赖链（infinity-sdk 0.7.3、xgboost<3.1、
      # onnxruntime）在 PROBE-002 里是按 3.12 实测的，换小版本等于让探针结论失效。
      # 升级路径是人工的：先改 requires-python + 重跑 uv lock + 复测 PROBE-002。
      # 补丁位（3.12.x）仍然自动跟——那是安全修复，正是要它跟的。
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
