[project]
name = "rag-parser"
version = "0.0.0"
description = "阶段 1 独立解析服务。T0 只建立 uv 项目、健康入口与容器构建入口。"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "uvicorn==0.52.4",
]

# DeepDOC（RAGFlow 固定提交）与其 xgboost / infinity 依赖不在 T0 范围。
# PROBE-002 已实测可行，正式接入在 T4；届时必须锁定 xgboost<3.1，
# 因为 updown_concat_xgb.model 是旧格式二进制模型。

[dependency-groups]
dev = [
    # starlette 1.6 的 TestClient 已弃用 httpx 1.x，改用 httpx2
    "httpx2==2.12.0",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.uv]
package = true
