# 阶段 1 本地开发中间件编排（T0）。
#
# 约定：
# - 六个 core 服务默认启动；parser 与 evaluation 使用显式 profile，不随日常开发拉起。
# - 不固定 container_name，允许 CI 与多个工作区并行运行（compose 项目名隔离）。
# - 端口全部绑定 127.0.0.1，不暴露到局域网；端口号可通过环境变量覆盖。
# - 所有服务都有健康检查，`docker compose up -d --wait` 才能真实反映可用性。
# - 数据卷为命名卷，`pnpm run infra:reset`（down -v）是唯一的清库入口。
#
# 镜像标签选择依据：
# - keycloak 26.2.5 / opensearch 2.19.1 / rabbitmq 3.13-management：PROBE-001/003/004 实测版本，直接复用。
# - postgres 18.6-trixie：18 是当前稳定主版本，18.6 为选定的补丁版；官方镜像已以 trixie 为默认基底；
#   Prisma 7 支持 PostgreSQL 18。选定 patch 级标签而非 `18`，避免同一分支内静默漂移。
# - redis 8.10.1-trixie：Redis 8 稳定线的当前补丁版，仅用于 SSE 续读窗（TTL 24h），不作为权威状态。
# - minio RELEASE.2025-09-07T16-13-09Z：冻结时点社区版最后一个 RELEASE 标签；MinIO 只有日期标签，
#   必须显式固定，否则 `latest` 会跨越不兼容的控制台与 API 变更。
# - node 22.23.1-trixie：与仓库 Node 基线完全一致，仅用于 evaluation profile 的本地运行容器。

name: ${COMPOSE_PROJECT_NAME:-rag-local}

services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须来自未跟踪的 .env 或运行环境}
      # 显式指定初始化编码与排序，避免宿主 locale 影响索引与排序行为
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18 官方镜像改变了数据目录约定：挂载点必须是 /var/lib/postgresql，
      # 实际数据落在其下的 18/docker 子目录，这样 pg_upgrade --link 不会跨越挂载边界。
      # 挂到 /var/lib/postgresql/data 会被 18 镜像判定为“未使用的卷”并拒绝启动。
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-rag} -d $${POSTGRES_DB:-rag}']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # 本地单节点关闭安全插件，仅限开发；生产配置不在阶段 1 范围
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      bootstrap.memory_lock: 'false'
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms2g -Xmx2g}
      knn.memory.circuit_breaker.limit: '50%'
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - '127.0.0.1:${OPENSEARCH_PORT:-9200}:9200'
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null",
        ]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 40s

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    hostname: rag-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rag}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD 必须来自未跟踪的 .env 或运行环境}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:-5672}:5672'
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # rabbitmq-diagnostics 一次只接受一个子命令，两个检查必须分开调用再 && 连接
      test:
        [
          'CMD-SHELL',
          'rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity',
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  redis:
    image: redis:8.10.1-trixie
    restart: unless-stopped
    # SSE 续读窗是可重建的派生数据，不开 AOF；权威事实只在 PostgreSQL
    command:
      ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ragadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 必须来自未跟踪的 .env 或运行环境}
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    restart: unless-stopped
    # start-dev 仅限本地；生产模式、TLS 与外部数据库不在阶段 1 范围
    command: ['start-dev', '--http-port=8080']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD 必须来自未跟踪的 .env 或运行环境}
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'false'
    ports:
      # 管理端口 9000 只在容器网络内被健康检查使用，不发布到宿主（会与 MinIO 9000 冲突）
      - '127.0.0.1:${KEYCLOAK_PORT:-8080}:8080'
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      # 26.x 的健康端点在独立管理端口 9000；镜像内无 curl，用 Java 自带的 /dev/tcp 探测
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -Eq '\"status\"[[:space:]]*:[[:space:]]*\"UP\"' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s

  # ── 显式 profile：不随日常 core 启动 ──

  parser:
    profiles: ['parser']
    build:
      context: ../../services/parser
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PARSER_PORT: 8100
      PARSER_LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:${PARSER_PORT:-8100}:8100'
    # DeepDOC 并发 1、RSS 警戒 8 GiB（ADR-0025）。T0 只声明容器上限，运行时强制在 T10
    deploy:
      resources:
        limits:
          memory: ${PARSER_MEMORY_LIMIT:-10g}
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health/live', timeout=2).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker-evaluation:
    profiles: ['evaluation']
    # 本地运行容器：直接挂载工作区，不构建镜像。生产镜像与部署不在阶段 1 范围。
    image: node:22.23.1-trixie
    restart: unless-stopped
    working_dir: /workspace
    command: ['node', 'apps/worker/dist/main.js']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_PROFILE: evaluation
      WORKER_HEALTH_PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rag}?schema=public
      OPENSEARCH_NODE: http://opensearch:9200
      RABBITMQ_HOST: rabbitmq
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      KEYCLOAK_BASE_URL: http://keycloak:8080
    volumes:
      - ../..:/workspace
    ports:
      - '127.0.0.1:${WORKER_EVALUATION_HEALTH_PORT:-3002}:3002'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3002/health/live'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres-data:
  opensearch-data:
  rabbitmq-data:
  redis-data:
  minio-data:
  keycloak-data:
